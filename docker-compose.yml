services:
  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile

    container_name: tabletap-backend

    ports:
      - "3000:3000"

    env_file:
      - ./backend/.env

    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    
    container_name: tabletap-frontend
    ports:
      - "5173:80"

    env_file:
      - ./frontend/.env

    restart: unless-stopped
