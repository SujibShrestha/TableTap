<body class="min-h-screen pb-32">

</button>

</div>
</header>

<h2 class="font-menu-item-title text-menu-item-title text-on-surface-variant italic mb-4">Your Order</h2>

</div>
<div>

<p class="font-price-label text-price-label text-primary mt-1">$18.00</p>
</div>
</div>
<!-- Quantity Editor -->
<div class="flex items-center gap-3 bg-background rounded-full px-2 py-1 border border-outline-variant shadow-sm">
<button class="w-6 h-6 flex items-center justify-center text-on-surface-variant hover:text-primary transition-colors">
<span class="material-symbols-outlined text-[16px]">remove</span>
</button>
<span class="font-body-main text-body-main text-on-surface-variant w-4 text-center">1</span>
<button class="w-6 h-6 flex items-center justify-center text-on-surface-variant hover:text-primary transition-colors">
<span class="material-symbols-outlined text-[16px]">add</span>
</button>
</div>
</div>

<div class="flex items-center gap-3 bg-background rounded-full px-2 py-1 border border-outline-variant shadow-sm">
