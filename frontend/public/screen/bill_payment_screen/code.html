<body class="bg-surface text-on-surface antialiased flex flex-col min-h-screen">
<!-- TopAppBar (Transactional - Hidden Nav, but keeping header for context) -->
<header class="bg-surface dark:bg-surface-dim shadow-[0px_10px_30px_rgba(45,36,30,0.05)] docked full-width top-0 z-50">
<div class="flex justify-between items-center px-container-padding-mobile py-unit w-full max-w-7xl mx-auto">
<button class="text-secondary font-normal hover:opacity-80 transition-opacity scale-95 duration-200">
<span class="material-symbols-outlined">arrow_back</span>
</button>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile italic text-primary dark:text-primary-fixed-dim">L'Artiste Bistro</h1>
<div class="text-secondary font-normal">Table 12</div>
</div>
</header>
<main class="flex-grow px-container-padding-mobile py-[32px] max-w-[600px] w-full mx-auto flex flex-col gap-section-gap">
<!-- Bill Summary Card -->
<section class="bg-[#F7F2EB] rounded-xl p-[32px] shadow-[0px_10px_30px_rgba(45,36,30,0.05)] flex flex-col gap-[24px]">
<h2 class="font-menu-item-title text-menu-item-title italic text-[#3b2d28] border-b border-surface-variant pb-[16px]">Your Check</h2>
<div class="flex flex-col gap-[16px]">
<!-- Item 1 -->
<div class="flex justify-between items-start">
<div class="flex flex-col">
<span class="font-body-main text-body-main text-[#3b2d28]">Avocado Toast</span>
<span class="font-body-secondary text-body-secondary text-[#3b2d28] opacity-70">Sourdough, poached egg</span>
</div>
<span class="font-price-label text-price-label text-[#3b2d28]">$14.00</span>
</div>
<!-- Item 2 -->
<div class="flex justify-between items-start">
<div class="flex flex-col">
<span class="font-body-main text-body-main text-[#3b2d28]">Matcha Latte</span>
<span class="font-body-secondary text-body-secondary text-[#3b2d28] opacity-70">Almond milk</span>
</div>
<span class="font-price-label text-price-label text-[#3b2d28]">$6.00</span>
</div>
</div>
<!-- Totals -->
<div class="border-t border-surface-variant pt-[24px] flex flex-col gap-[8px]">
<div class="flex justify-between font-body-secondary text-body-secondary text-[#3b2d28] opacity-70">
<span>Subtotal</span>
<span>$20.00</span>
</div>
<div class="flex justify-between font-body-secondary text-body-secondary text-[#3b2d28] opacity-70">
<span>Tax</span>
<span>$1.80</span>
</div>
<div class="flex justify-between font-body-secondary text-body-secondary text-[#3b2d28] opacity-70">
<span>Gratuity (Suggested 20%)</span>
<span>$4.00</span>
</div>
</div>
<div class="mt-[16px] pt-[24px] border-t border-surface-variant flex justify-between items-baseline">
<span class="font-menu-item-title text-menu-item-title text-[#3b2d28]">Total</span>
<span class="font-display-lg text-display-lg italic text-primary-container">$30.00</span>
</div>
</section>
<!-- Payment Actions -->
<section class="flex flex-col gap-[16px]">
<button class="w-full bg-primary-container text-on-primary-container font-cta-label text-cta-label italic uppercase py-[24px] rounded-xl shadow-[0px_10px_30px_rgba(45,36,30,0.05)] hover:opacity-90 active:scale-95 transition-all">
                Pay Online
            </button>
<button class="w-full bg-[#F7F2EB] text-[#3b2d28] border border-outline-variant font-cta-label text-cta-label italic uppercase py-[24px] rounded-xl shadow-[0px_10px_30px_rgba(45,36,30,0.05)] hover:opacity-90 active:scale-95 transition-all">
                Pay at Counter
            </button>
</section>
