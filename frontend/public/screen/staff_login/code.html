<!DOCTYPE html><html class="h-full" lang="en"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>L'Artiste Bistro - Staff Login</title>
<!-- Fonts and Icons -->
<link href="https://fonts.googleapis.com" rel="preconnect">

                        "secondary-fixed": "#ede1d0",
                        "on-tertiary-fixed-variant": "#4f453d",

<style>
        .custom-shadow {
            box-shadow: 0px 10px 30px rgba(45,36,30,0.05);
        }
        .hover-lift {
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        .hover-lift:hover {
            transform: translateY(-4px);
            box-shadow: 0px 15px 40px rgba(45,36,30,0.08);
        }
    </style>
</head>
<body class="bg-surface text-on-surface h-full flex flex-col items-center justify-center font-body-main antialiased relative overflow-hidden">
<!-- Decorative background elements for warm minimalism -->
<div class="absolute top-0 left-0 w-full h-1/3 bg-gradient-to-b from-surface-container-high/30 to-transparent pointer-events-none"></div>
<div class="absolute -top-[20%] -right-[10%] w-[50%] h-[50%] rounded-full bg-tertiary-fixed-dim/20 blur-3xl pointer-events-none"></div>
<main class="w-full max-w-md px-container-padding-mobile md:px-0 z-10">
<!-- Login Card -->
<div class="bg-surface-container-lowest rounded-xl custom-shadow p-8 md:p-10 border border-surface-variant flex flex-col gap-8">
<!-- Branding -->
<header class="text-center">
<h1 class="font-display-lg text-display-lg text-primary italic mb-2 tracking-tight">L'Artiste Bistro</h1>
<p class="font-body-secondary text-body-secondary text-on-surface-variant">Staff Authentication</p>
</header>
<form class="flex flex-col gap-section-gap">
<!-- Role Selection -->
<div class="flex flex-col gap-unit">
<label class="font-caption-bold text-caption-bold text-on-surface-variant uppercase">Select Role</label>
<div class="grid grid-cols-3 gap-unit">
<!-- Admin -->
<label class="cursor-pointer group relative">
<input checked="" class="peer sr-only" name="role" type="radio" value="admin">
<div class="flex flex-col items-center justify-center p-4 rounded-lg bg-surface-container-low border border-transparent peer-checked:border-primary peer-checked:bg-primary/5 transition-colors duration-200">
<span class="material-symbols-outlined text-secondary peer-checked:text-primary mb-2 transition-colors">shield</span>
<span class="font-body-secondary text-body-secondary text-on-surface peer-checked:text-primary font-medium">Admin</span>
</div>
</label>
<!-- Waiter -->
<label class="cursor-pointer group relative">
<input class="peer sr-only" name="role" type="radio" value="waiter">
<div class="flex flex-col items-center justify-center p-4 rounded-lg bg-surface-container-low border border-transparent peer-checked:border-primary peer-checked:bg-primary/5 transition-colors duration-200">
<span class="material-symbols-outlined text-secondary peer-checked:text-primary mb-2 transition-colors">restaurant</span>
<span class="font-body-secondary text-body-secondary text-on-surface peer-checked:text-primary font-medium">Waiter</span>
</div>
</label>
<!-- Kitchen -->
<label class="cursor-pointer group relative">
<input class="peer sr-only" name="role" type="radio" value="kitchen">
<div class="flex flex-col items-center justify-center p-4 rounded-lg bg-surface-container-low border border-transparent peer-checked:border-primary peer-checked:bg-primary/5 transition-colors duration-200">
<span class="material-symbols-outlined text-secondary peer-checked:text-primary mb-2 transition-colors">soup_kitchen</span>
<span class="font-body-secondary text-body-secondary text-on-surface peer-checked:text-primary font-medium">Kitchen</span>
</div>
</label>
</div>
</div>
<!-- Credential Entry -->
<div class="flex flex-col gap-4">
<div class="flex flex-col gap-unit">
<label class="font-caption-bold text-caption-bold text-on-surface-variant uppercase" for="pin">PIN / Password</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-on-surface-variant">lock</span>
<input class="w-full bg-surface-container-low border border-outline-variant rounded-lg py-4 pl-12 pr-4 font-body-main text-body-main text-on-surface focus:outline-none focus:ring-2 focus:ring-primary focus:border-primary transition-all placeholder:text-on-surface-variant/50" id="pin" name="pin" placeholder="Enter your 4-digit PIN" type="password">
</div>
</div>
</div>
<!-- Actions -->
<div class="flex flex-col gap-4 pt-4">
<button class="w-full bg-primary-container text-on-primary-container font-cta-label text-cta-label uppercase py-4 rounded-lg hover-lift hover:opacity-90 transition-all flex items-center justify-center gap-2" type="submit">
                        Sign In
                        <span class="material-symbols-outlined text-[18px]">login</span>
</button>
<a class="text-center font-body-secondary text-body-secondary text-on-surface-variant hover:text-primary transition-colors underline-offset-4 hover:underline" href="#">
                        Forgot PIN? Contact Admin
                    </a>
</div>
</form>
</div>
</main>
</body></html>
